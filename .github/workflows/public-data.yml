name: Public data checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked content for private identifiers
        run: python3 tools/check-public-tree.py
      - name: Check publication-gate regressions
        run: python3 -m unittest discover -s tests -p test_public_data_checks.py
      - name: Download verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan committed history without exposing values
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --log-opts=--all .'
